<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>你适合什么类型的男友 · 性格匹配测试</title>
<style>
  :root{
    --ink:#1f1b2e;
    --muted:#6b6585;
    --line:#ece9f6;
    --card:#ffffff;
    --primary:#6c5ce7;
    --primary-soft:#f2efff;
    --pink:#ff6b9d;
    --ok:#38a169;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:var(--ink);
    background:#faf9ff;
    min-height:100vh;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  /* ---------- 背景装饰 ---------- */
  .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .bg::before{
    content:"";position:absolute;inset:0;
    background:
      radial-gradient(120% 90% at 8% -10%, #f3eeff 0%, rgba(243,238,255,0) 55%),
      radial-gradient(100% 80% at 100% 0%, #ffeef5 0%, rgba(255,238,245,0) 55%),
      radial-gradient(120% 100% at 50% 110%, #eef6ff 0%, rgba(238,246,255,0) 60%);
  }
  .orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:.5}
  .orb.a{width:340px;height:340px;background:#d9ccff;top:-90px;left:-90px}
  .orb.b{width:300px;height:300px;background:#ffcfe1;top:38%;right:-110px}
  .orb.c{width:260px;height:260px;background:#c7e6ff;bottom:-90px;left:18%}

  /* ---------- 布局 ---------- */
  .wrap{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:28px 20px 80px}
  .screen{display:none;animation:fadeUp .5s cubic-bezier(.2,.8,.25,1) both}
  .screen.active{display:block}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .card{
    background:var(--card);border-radius:26px;padding:34px 32px;
    box-shadow:0 24px 70px -28px rgba(76,58,150,.30), 0 2px 6px rgba(76,58,150,.05);
    border:1px solid rgba(255,255,255,.9);
  }

  /* ---------- 首页 ---------- */
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:26px}
  .brand .dot{width:11px;height:11px;border-radius:50%;background:linear-gradient(135deg,#6c5ce7,#ff6b9d)}
  .brand span{font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  h1{margin:0 0 14px;font-size:38px;line-height:1.25;letter-spacing:-.02em;font-weight:800}
  h1 .grad{background:linear-gradient(120deg,#6c5ce7 0%,#a06cd5 45%,#ff6b9d 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{color:var(--muted);font-size:16px;margin:0 0 26px}
  .meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:30px}
  .pill{
    display:inline-flex;align-items:center;gap:7px;background:#f7f5ff;border:1px solid #ece7ff;
    color:#5a4fb5;font-size:13px;font-weight:600;padding:7px 14px;border-radius:999px;
  }
  .pill i{width:6px;height:6px;border-radius:50%;background:#a394f5;display:block}

  .btn{
    appearance:none;border:0;cursor:pointer;font-family:inherit;font-weight:700;font-size:16px;
    padding:16px 34px;border-radius:16px;color:#fff;
    background:linear-gradient(120deg,#6c5ce7 0%,#8b6ce7 55%,#ff6b9d 130%);
    box-shadow:0 14px 30px -12px rgba(108,92,231,.75);
    transition:transform .18s ease, box-shadow .18s ease, filter .18s ease;
  }
  .btn:hover{transform:translateY(-2px);box-shadow:0 20px 38px -14px rgba(108,92,231,.85)}
  .btn:active{transform:translateY(0)}
  .btn.ghost{
    background:#fff;color:var(--primary);border:1.5px solid #e2dcff;
    box-shadow:0 6px 18px -12px rgba(108,92,231,.6);font-size:15px;padding:13px 26px;
  }
  .btn.ghost:hover{border-color:#c9bfff;background:#fbfaff}
  .btn-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}

  .preview-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:34px;padding-top:28px;border-top:1px dashed var(--line)}
  .pv{text-align:center;padding:14px 6px;border-radius:16px;background:#fbfaff;border:1px solid #f1edff;transition:.2s}
  .pv:hover{transform:translateY(-3px);background:#fff;border-color:#e3dbff}
  .pv svg{width:22px;height:22px;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .pv b{display:block;font-size:12.5px;margin-top:7px;font-weight:700;letter-spacing:.02em}

  /* ---------- 答题页 ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .counter{font-size:14px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .counter b{color:var(--primary);font-size:19px;margin-right:2px}
  .track{height:8px;background:#efeafd;border-radius:99px;overflow:hidden;margin-bottom:30px}
  .track > i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#6c5ce7,#ff6b9d);transition:width .45s cubic-bezier(.2,.8,.25,1)}
  .qtext{font-size:25px;font-weight:800;line-height:1.45;letter-spacing:-.01em;margin:0 0 26px}
  .qtag{display:inline-block;font-size:12px;font-weight:700;letter-spacing:.12em;color:#9b90e0;background:#f6f3ff;padding:5px 12px;border-radius:8px;margin-bottom:14px}

  .opts{display:flex;flex-direction:column;gap:12px}
  .opt{
    display:flex;align-items:flex-start;gap:14px;width:100%;text-align:left;
    background:#fff;border:1.5px solid #eeebf9;border-radius:18px;
    padding:17px 20px;cursor:pointer;font-family:inherit;font-size:16px;color:var(--ink);
    font-weight:500;line-height:1.55;transition:all .18s ease;position:relative;overflow:hidden;
  }
  .opt::after{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--primary);transform:scaleY(0);transition:transform .2s;transform-origin:center}
  .opt:hover{border-color:#d6ccff;background:#fdfcff;transform:translateX(3px)}
  .opt:hover::after{transform:scaleY(1)}
  .opt .k{
    flex:0 0 27px;height:27px;border-radius:9px;background:#f4f1ff;color:#6c5ce7;
    font-size:13px;font-weight:800;display:flex;align-items:center;justify-content:center;margin-top:1px;
    transition:.18s;
  }
  .opt:hover .k{background:var(--primary);color:#fff}
  .opt.sel{border-color:var(--primary);background:#f9f7ff;box-shadow:0 8px 22px -14px rgba(108,92,231,.8)}
  .opt.sel .k{background:var(--primary);color:#fff}
  .opt.sel::after{transform:scaleY(1)}

  .navrow{display:flex;justify-content:space-between;align-items:center;margin-top:26px;min-height:44px}
  .back{
    background:none;border:0;font-family:inherit;font-size:15px;font-weight:600;color:#8b83b0;
    cursor:pointer;padding:10px 4px;transition:.18s;
  }
  .back:hover{color:var(--primary)}
  .back[hidden]{visibility:hidden;display:block}
  .hint{font-size:13.5px;color:#a9a1c6}

  /* ---------- 结果页 ---------- */
  .res-head{text-align:center;padding-bottom:6px}
  .ring-wrap{position:relative;width:150px;height:150px;margin:6px auto 18px}
  .ring{width:150px;height:150px;transform:rotate(-90deg)}
  .ring circle{fill:none;stroke-width:10;stroke-linecap:round}
  .ring .bgc{stroke:#f1edff}
  .ring .fgc{stroke:url(#ringGrad);transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.25,1)}
  .ring-num{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .ring-num b{font-size:38px;font-weight:800;line-height:1;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .ring-num span{font-size:11.5px;letter-spacing:.16em;color:var(--muted);font-weight:700;margin-top:5px}
  .res-icon{width:62px;height:62px;border-radius:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 16px;color:#fff}
  .res-icon svg{width:31px;height:31px;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
  .res-eyebrow{font-size:12.5px;letter-spacing:.2em;color:var(--muted);font-weight:700;margin-bottom:8px}
  .res-name{font-size:33px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px;line-height:1.25}
  .res-sub{font-size:16px;color:var(--muted);margin:0 0 20px}
  .chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:30px}
  .chip{font-size:13px;font-weight:700;padding:6px 14px;border-radius:999px;border:1px solid}

  .blocks{display:flex;flex-direction:column;gap:16px;text-align:left}
  .blk{background:#fbfaff;border:1px solid #f1edff;border-radius:18px;padding:20px 22px}
  .blk h4{margin:0 0 9px;font-size:14px;letter-spacing:.06em;font-weight:800;color:#5a4fb5;display:flex;align-items:center;gap:9px}
  .blk h4::before{content:"";width:14px;height:2px;border-radius:2px;background:var(--primary);display:block;opacity:.55}
  .blk p{margin:0;font-size:15px;color:#413a5c;line-height:1.75}

  .rank{margin-top:34px;padding-top:28px;border-top:1px dashed var(--line)}
  .rank h3{margin:0 0 6px;font-size:17px;font-weight:800}
  .rank .note{font-size:13px;color:var(--muted);margin:0 0 20px}
  .rk{display:flex;align-items:center;gap:13px;margin-bottom:13px}
  .rk .nm{flex:0 0 96px;font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .rk .bar{flex:1;height:10px;background:#f3f0fd;border-radius:99px;overflow:hidden}
  .rk .bar i{display:block;height:100%;width:0;border-radius:99px;transition:width .9s cubic-bezier(.2,.8,.25,1)}
  .rk .pc{flex:0 0 44px;text-align:right;font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
  .rk.first .nm{color:var(--primary)}
  .floatbar{
    position:sticky;bottom:0;margin-top:32px;padding:16px 0 6px;
    background:linear-gradient(to top,#fff 62%,rgba(255,255,255,0));
  }
  .toast{
    position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);
    background:#231d3d;color:#fff;font-size:14px;font-weight:600;padding:12px 22px;border-radius:14px;
    opacity:0;pointer-events:none;transition:.3s;z-index:99;box-shadow:0 16px 40px -14px rgba(0,0,0,.6);
  }
  .toast.on{opacity:1;transform:translate(-50%,0)}

  .foot{text-align:center;font-size:12.5px;color:#b3acca;margin-top:26px;line-height:1.9}

  @media (max-width:640px){
    .wrap{padding:20px 15px 60px}
    .card{padding:26px 20px;border-radius:22px}
    h1{font-size:29px}
    .qtext{font-size:20px}
    .preview-grid{grid-template-columns:repeat(2,1fr)}
    .res-name{font-size:26px}
    .rk .nm{flex-basis:78px;font-size:13px}
    .opt{padding:15px 16px;font-size:15px}
  }
</style>
</head>
<body>
<div class="bg"><div class="orb a"></div><div class="orb b"></div><div class="orb c"></div></div>

<div class="wrap">

  <!-- ============ 首页 ============ -->
  <section class="screen active" id="s-intro">

      <div class="btn-row">

  </section>

  <!-- ============ 答题页 ============ -->
  <section class="screen" id="s-quiz">
    <div class="card">
      <div class="topbar">
        <div class="counter"><b id="cur">1</b>/ <span id="total">25</span></div>

  <!-- ============ 结果页 ============ -->
  <section class="screen" id="s-result">
    <div class="card">

        <svg width="0" height="0" aria-hidden="true"><defs>
          <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">

        <div class="ring-wrap">
          <svg class="ring" viewBox="0 0 150 150">
            <circle class="bgc" cx="75" cy="75" r="62"></circle>

          </svg>
          <div class="ring-num"><b id="pct">0</b><span>契合指数</span></div>
        </div>

        <div class="res-icon" id="resIcon"></div>
        <div class="res-eyebrow">你的最佳男友类型</div>
        <h2 class="res-name" id="resName"></h2>
        <p class="res-sub" id="resSub"></p>
        <div class="chips" id="resChips"></div>
      </div>

      <div class="blocks">
        <div class="blk"><h4>他是这样的人</h4><p id="b1"></p></div>
        <div class="blk"><h4>你们在一起的样子</h4><p id="b2"></p></div>
        <div class="blk"><h4>需要留意的地方</h4><p id="b3"></p></div>
        <div class="blk"><h4>推荐约会场景</h4><p id="b4"></p></div>
      </div>

      <div class="rank">
        <h3>完整契合度排行</h3>
        <p class="note">基于你 25 题的选择计算，条形长度为相对契合度。</p>
        <div id="rankList"></div>
      </div>

      <div class="floatbar">
        <div class="btn-row">
          <button class="btn" id="btn-again">再测一次</button>
          <button class="btn ghost" id="btn-copy">复制我的结果</button>
        </div>
      </div>
    </div>
    <p class="foot">本测试仅用于娱乐与自我了解，不构成任何心理学诊断。</p>
  </section>

</div>

<div class="toast" id="toast">已复制到剪贴板</div>

/* =========================================================
   逻辑
   ========================================================= */
const TOTAL = QS.length;
const answers = new Array(TOTAL).fill(null);
let idx = 0;
const $ = id => document.getElementById(id);
const LETTERS = ['A','B','C','D','E'];

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  $(id).classList.add('active');
  window.scrollTo({top:0,behavior:'smooth'});
}

/* 首页类型预览 */
function renderPreview(){
  const box = $('preview');
  ORDER.forEach(k=>{
    const t = TYPES[k];
    const el = document.createElement('div');
    el.className='pv';
    el.innerHTML = '<svg viewBox="0 0 24 24" stroke="'+t.color+'">'+ICONS[t.icon]+'</svg><b style="color:'+t.color+'">'+t.name+'</b>';
    box.appendChild(el);
  });
}

/* 渲染题目 */
function renderQ(){
  const item = QS[idx];
  $('cur').textContent = idx+1;
  $('total').textContent = TOTAL;
  $('qtag').textContent = 'Q' + (idx+1);
  $('qtext').textContent = item.q;
  $('bar').style.width = ((idx)/TOTAL*100) + '%';
  $('remain').textContent = '还剩 ' + (TOTAL-idx) + ' 题';
  $('nudge').textContent = '';

  const box = $('opts');
  box.innerHTML = '';
  item.o.forEach((opt,i)=>{
    const b = document.createElement('button');
    b.className = 'opt' + (answers[idx]===i ? ' sel' : '');
    b.innerHTML = '<span class="k">'+LETTERS[i]+'</span><span>'+opt[0]+'</span>';
    b.onclick = ()=>choose(i);
    box.appendChild(b);
  });

  $('btn-back').hidden = (idx===0);

  // 题目切换动画
  const area = $('qarea');
  area.style.animation='none';
  void area.offsetWidth;
  area.style.animation='fadeUp .38s cubic-bezier(.2,.8,.25,1) both';
}

let locked = false;
function choose(i){
  if(locked) return;
  locked = true;
  answers[idx] = i;
  const nodes = $('opts').querySelectorAll('.opt');
  nodes.forEach(n=>n.classList.remove('sel'));
  nodes[i].classList.add('sel');
  $('bar').style.width = ((idx+1)/TOTAL*100) + '%';

  setTimeout(()=>{
    locked = false;
    if(idx < TOTAL-1){
      idx++;
      renderQ();
    }else{
      score();
    }
  }, 240);
}

/* 计算得分 */
function score(){
  const s = {}; ORDER.forEach(k=>s[k]=0);
  answers.forEach((a,qi)=>{
    if(a===null) return;
    const w = QS[qi].o[a][1];
    for(const k in w) s[k] += w[k];
  });

  const total = ORDER.reduce((n,k)=>n+s[k],0) || 1;
  const ranked = ORDER.map(k=>({k, v:s[k], r:s[k]/total}))
                      .sort((a,b)=> b.v-a.v);

  const top = ranked[0];
  const pctRaw = 60 + (top.r - 0.125) * 200;
  const pct = Math.max(62, Math.min(97, Math.round(pctRaw)));

  renderResult(top.k, pct, ranked);
}

function renderResult(key, pct, ranked){
  const t = TYPES[key];
  $('resIcon').style.background = t.grad;
  $('resIcon').innerHTML = '<svg viewBox="0 0 24 24" stroke="#fff">'+ICONS[t.icon]+'</svg>';
  $('resName').textContent = t.name;
  $('resName').style.color = t.color;
  $('resSub').textContent = t.sub;

  $('resChips').innerHTML = t.tags.map(tag =>
    '<span class="chip" style="color:'+t.color+';border-color:'+t.color+'33;background:'+t.color+'0f">'+tag+'</span>'
  ).join('');

  $('b1').textContent = t.d1;
  $('b2').textContent = t.d2;
  $('b3').textContent = t.d3;
  $('b4').textContent = t.d4;

  // 排名条
  const list = $('rankList');
  list.innerHTML = '';
  const max = ranked[0].v || 1;
  ranked.forEach((row,i)=>{
    const T = TYPES[row.k];
    const w = Math.max(6, Math.round(row.v/max*100));
    const el = document.createElement('div');
    el.className = 'rk' + (i===0?' first':'');
    el.innerHTML =
      '<div class="nm">'+T.name+'</div>'+
      '<div class="bar"><i style="background:'+T.grad+'"></i></div>'+
      '<div class="pc">'+w+'%</div>';
    list.appendChild(el);
    const fill = el.querySelector('.bar i');
    setTimeout(()=>{ fill.style.width = w+'%'; }, 90 + i*80);
  });

  show('s-result');

  // 环形动画
  const R = 62, C = 2*Math.PI*R;
  const ring = $('ringfg');
  ring.style.strokeDasharray = C;
  ring.style.strokeDashoffset = C;
  setTimeout(()=>{ ring.style.strokeDashoffset = C*(1-pct/100); }, 120);

  // 数字滚动
  const num = $('pct');
  let cur = 0;
  const step = Math.max(1, Math.ceil(pct/28));
  const timer = setInterval(()=>{
    cur += step;
    if(cur >= pct){ cur = pct; clearInterval(timer); }
    num.textContent = cur;
  }, 32);

  window.__resultText = '我的男友类型测试结果：《' + t.name + '》— ' + t.sub +
    '｜契合指数 ' + pct + '%\n完整排行：' +
    ranked.map((r,i)=>(i+1)+'. '+TYPES[r.k].name).join('  ');
}

/* 事件绑定 */
$('btn-start').onclick = ()=>{
  idx = 0;
  answers.fill(null);
  renderQ();
  show('s-quiz');
};
$('btn-back').onclick = ()=>{
  if(idx>0){ idx--; renderQ(); }
};
$('btn-again').onclick = ()=>{
  idx = 0;
  answers.fill(null);
  show('s-intro');
};
$('btn-copy').onclick = async ()=>{
  const txt = window.__resultText || '';
  try{
    await navigator.clipboard.writeText(txt);
    toast('已复制到剪贴板');
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = txt;
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand('copy'); toast('已复制到剪贴板'); }
    catch(err){ toast('复制失败，请手动选择文本'); }
    document.body.removeChild(ta);
  }
};
function toast(msg){
  const el = $('toast');
  el.textContent = msg;
  el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'), 1800);
}
